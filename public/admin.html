<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Kudos Moderation – Employee Portal</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="header">
    <h1>🛡️ Kudos Moderation</h1>
    <nav>
      <a href="/">← Back to dashboard</a>
      <button id="logout-btn" class="secondary small" type="button">Log out</button>
    </nav>
  </header>

  <main class="container">
    <section class="card">
      <div id="admin-error" class="banner" role="alert" hidden></div>
      <div class="tabs" role="tablist" aria-label="Filter kudos">
        <button type="button" data-status="all" class="active">All</button>
        <button type="button" data-status="visible">Visible</button>
        <button type="button" data-status="hidden">Hidden</button>
        <button type="button" data-status="reported">Reported</button>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>From → To</th><th>Message</th><th>Status</th><th>Moderation details</th><th>Actions</th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
      <p id="empty" class="empty" hidden>Nothing to show for this filter.</p>
      <p style="text-align:center"><button id="load-more" class="secondary" type="button" hidden>Load more</button></p>
    </section>
  </main>

  <dialog id="action-dialog">
    <form method="dialog" id="action-form">
      <h3 id="dialog-title"></h3>
      <p id="dialog-text" class="hint"></p>
      <label for="action-reason">Reason (required)</label>
      <input id="action-reason" maxlength="255" />
      <p id="action-error" class="field-error" role="alert"></p>
      <div class="dialog-actions">
        <button type="button" class="secondary" id="action-cancel">Cancel</button>
        <button type="submit" id="action-confirm" class="danger">Confirm</button>
      </div>
    </form>
  </dialog>

  <script src="/common.js"></script>
  <script src="/admin.js"></script>
</body>
</html>
